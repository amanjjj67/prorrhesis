[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prorrhesis"
version = "0.1.0"
description = "A local, calibrated match-prediction lab for the top 5 European football leagues"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "pydantic",
    "pyyaml",
    "joblib",
    "pytest",
    "tzdata",
    "rapidfuzz",
]

[project.scripts]
prorrhesis = "prorrhesis.__main__:main"

[tool.setuptools.packages.find]
include = ["prorrhesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
